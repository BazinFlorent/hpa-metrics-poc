apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hpa-demo-app
  namespace: monitoring
  labels:
    monitoring: hpa-poc
spec:
  namespaceSelector:
    matchNames:
      - hpa-demo
  selector:
    matchLabels:
      app: hpa-demo-app
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
