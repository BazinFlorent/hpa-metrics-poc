
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hpa-metrics-poc-app
  namespace: monitoring
  labels:
    monitoring: hpa-metrics-poc

spec:
  namespaceSelector:
    matchNames:
      - hpa-metrics-poc

  selector:
    matchLabels:
      app: hpa-metrics-poc-app

  endpoints:
    - port: http
      path: /metrics
      interval: 10s

