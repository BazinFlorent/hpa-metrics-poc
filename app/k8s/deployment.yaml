
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-metrics-poc-app
  namespace: hpa-metrics-poc
  labels:
    app: hpa-metrics-poc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-metrics-poc-app
  template:
    metadata:
      labels:
        app: hpa-metrics-poc-app
    spec:
      containers:
        - name: hpa-metrics-poc-app
          image: hpa-metrics-poc-app:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
